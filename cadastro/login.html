<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | CIAL Asa Sul</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="cadastro css/login.css">

    <link
    rel="stylesheet"
    href="pagina css/global.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

        <div class="logo">

            <a href="../pagina/index.html">

                <img src="../pagina/imagem/logo1.webp"
                     alt="CIAL Asa Sul">

            </a>

        </div>

            <header class="login-header">

                <h1>Bem-vindo de volta!</h1>

                <p>Faça login para acessar sua conta.</p>

            </header>

            <form id="loginForm" autocomplete="on">

                <div class="form-group">

                    <label for="usuario">

                        E-mail ou CPF

                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu e-mail ou CPF"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">

                        Senha

                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleSenha"
                            class="toggle-password"
                            aria-label="Mostrar senha">

                            👁

                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="lembrar"
                            name="lembrar">

                        Lembrar de mim

                    </label>

                    <a href="recuperar-senha.html">

                        Esqueci minha senha

                    </a>

                </div>

                <button type="submit" class="btn-login">

                    Entrar

                </button>

            </form>

            <footer class="login-footer">

                <p>

                    Ainda não possui uma conta?

                </p>

                <a href="cadastro.html" class="btn-cadastro">

                    Criar Cadastro

                </a>

            </footer>

        </section>

    </main>

    <script src="cadastro js/login.js"></script>

</body>

</html>
