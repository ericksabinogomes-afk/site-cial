<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Carrinho | CIAL Asa Sul</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/carrinho.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="cart-header">

    <div class="container">

        <a href="index.html" class="logo">

            <img src="imagens/logo.png" alt="CIAL Asa Sul">

        </a>

        <a href="produtos.html" class="back-shop">

            <i class="fa-solid fa-arrow-left"></i>

            Continuar Comprando

        </a>

    </div>

</header>

<section class="cart-title">

    <div class="container">

        <h1>

            <i class="fa-solid fa-cart-shopping"></i>

            Meu Carrinho

        </h1>

        <p>

            Revise seus produtos antes de finalizar seu pedido.

        </p>

    </div>

</section>

<main class="cart-page">

    <div class="container">

        <section class="cart-products">


        </section>

        <section class="order-summary">

            <h2>

                Resumo do Pedido

            </h2>

            <div class="summary-row">

                <span>Subtotal</span>

                <strong id="subtotal">

                    R$ 0,00

                </strong>

            </div>

            <div class="summary-row">

                <span>Frete</span>

                <strong>

                    A calcular

                </strong>

            </div>

            <div class="summary-total">

                <span>Total</span>

                <strong id="total">

                    R$ 0,00

                </strong>

            </div>

            <div class="cart-notes">

                <label for="observacoes">

                    Observações

                </label>

                <textarea

                    id="observacoes"

                    placeholder="Ex.: Retirar na loja, orçamento para empresa, entrega...">

                </textarea>

            </div>

            <div class="cart-buttons">

                <button class="btn-finish">

                    Finalizar Pedido

                </button>

                <button class="btn-whatsapp">

                    <i class="fa-brands fa-whatsapp"></i>

                    Finalizar pelo WhatsApp

                </button>

            </div>

            <a href="produtos.html"
               class="continue-shopping">

                ← Continuar Comprando

            </a>

        </section>

    </div>

</main>

<footer>

    <!-- Footer da CIAL -->

</footer>

<script src="js/carrinho.js"></script>

</body>

</html>
