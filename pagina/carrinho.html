<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | CIAL Asa Sul</title>

    <link rel="stylesheet" href="css/carrinho.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="../pagina/pagina css/carrinho.css">

</head>

<body>

    <!--==========================
            HEADER
    ===========================-->

    <header class="cart-header">

        <div class="container">

            <a href="index.html" class="logo">

                <img src="../pagina/imagem/logo1.webp" alt="Logo CIAL">

            </a>

            <a href="produtos.html" class="btn-back">

                <i class="fa-solid fa-arrow-left"></i>

                Continuar Comprando

            </a>

        </div>

    </header>


    <!--==========================
            BANNER
    ===========================-->

    <section class="cart-banner">

        <div class="container">

            <h1>

                <i class="fa-solid fa-cart-shopping"></i>

                Meu Carrinho

            </h1>

            <p>

                Confira seus produtos antes de finalizar seu pedido.

            </p>

        </div>

    </section>



    <!--==========================
            CONTEÚDO
    ===========================-->

    <main class="cart-main">

        <div class="container cart-layout">


            <!-- Produtos -->

            <section class="cart-products">

                <!--
                    Os produtos serão criados
                    automaticamente pelo JavaScript.
                -->

            </section>



            <!-- Resumo -->

            <aside class="cart-summary">

                <h2>

                    Resumo do Pedido

                </h2>


                <div class="summary-row">

                    <span>Subtotal</span>

                    <strong id="subtotal">

                        R$ 0,00

                    </strong>

                </div>


                <div class="summary-row">

                    <span>Frete</span>

                    <strong id="shipping">

                        A calcular

                    </strong>

                </div>


                <div class="summary-row">

                    <span>Desconto</span>

                    <strong id="discount">

                        R$ 0,00

                    </strong>

                </div>


                <hr>


                <div class="summary-total">

                    <span>Total</span>

                    <strong id="total">

                        R$ 0,00

                    </strong>

                </div>


                <label for="obs">

                    Observações

                </label>

                <textarea
                    id="obs"
                    placeholder="Deseja informar alguma observação sobre o pedido?"></textarea>


                <button class="btn-finish">

                    <i class="fa-solid fa-check"></i>

                    Finalizar Pedido

                </button>


                <button class="btn-whatsapp">

                    <i class="fa-brands fa-whatsapp"></i>

                    Enviar pelo WhatsApp

                </button>

            </aside>

        </div>

    </main>



    <!--==========================
            FOOTER
    ===========================-->

    <footer>

        <!-- Mesmo footer utilizado no restante do site -->

    </footer>



    <script src="../js/carrinho.js"></script>

</body>

</html>
